# Demo Info


type: application


title: GE Use Case Qualification Agent


thumbnail_summary: Qualify, architecturally review, and rank enterprise AI use cases inside Gemini Enterprise—turning raw ideas into quantified Business Value Briefs, 22-point Technical Dossiers, and a 4-quadrant CoE portfolio in under 10 minutes.


purpose: |
  Enterprise AI Centers of Excellence (CoEs) receive dozens of generative AI requests across business units, but rely on disconnected spreadsheets and repetitive workshops to evaluate ROI and technical feasibility.

  The GE Use Case Qualification Agent embeds the GE App Use Case Discovery Framework natively inside Gemini Enterprise. Across three guided workflows—Business Value Intake, Technical Architecture Review, and CoE Portfolio Prioritization—stakeholders converse naturally while the agent populates interactive A2UI forms, computes annual hours saved, assigns Capability Levels 1–6 with anti-overcommitment rules, evaluates 22 technical readiness subcriteria, and segments the backlog into actionable quadrants.
  * **Built with Demo Engineering Skills**: Created end-to-end with the [go/demo-eng-skills](https://demospace.corp.goog/demo/2155) Demo Engineering Skills library


business_value: |
  * **Eliminate Unquantified AI Science Projects:** Calculates auditable annual hours saved from user headcount, weekly frequency, and minutes saved per task over 50 work weeks without invented benchmarks.
  * **Prevent Costly Over-Engineering:** Maps every request to the simplest Gemini Enterprise capability (Levels 1–6, from no-code skills to pro-code custom agents) before committing engineering capacity.
  * **Cut Technical Discovery Time by 70%:** Locks Phase 1 business baselines in Cloud Storage so Solution Architects immediately review systems, network transit, IAM, and ACLs without re-interviewing the business.
  * **Board-Ready Portfolio Prioritization:** Automatically scores Business Value (1–5) and Feasibility (1–5) to rank opportunities into Quick Wins, Strategic Bets, Departmental Niche, and Deprioritized quadrants.


technical_value: |
  * **Native A2A + Interactive A2UI v0.8 Architecture:** Streams JSON-RPC events from Cloud Run to Gemini Enterprise to render live side-panel forms, tabs, tables, and Vega-Lite quadrant charts alongside chat.
  * **Evidence-Gated Gemini Extraction & Deterministic Scoring:** Pairs Gemini Flash structured output with verbatim quote verification and deterministic Python engines for tiering and 22-point readiness scoring.
  * **Multi-Actor Optimistic Concurrency:** Persists records in Cloud Storage using three-way merges and generation preconditions so concurrent business and technical sessions never overwrite each other.
  * **Zero-Trust Click-to-Deploy:** Pinned SHA-256 supply chain, non-root container, Discovery Engine service-agent IAM enforcement, and automated GE license provisioning.
  * **Built with Demo Engineering Skills**: Architected, built, and validated with the [go/demo-eng-skills](https://demospace.corp.goog/demo/2155) Demo Engineering Skills library




