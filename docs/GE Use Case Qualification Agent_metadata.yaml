# Demo Info


type: application


title: GE Use Case Qualification Agent


thumbnail_summary: Qualify, architecturally review, and rank enterprise AI use cases inside Gemini Enterprise - turning raw ideas into quantified Business Value Briefs, 22-point Technical Dossiers, and a 4-quadrant CoE portfolio.


purpose: |
  Enterprise AI Centers of Excellence (CoEs) receive dozens of generative AI requests across business units, but rely on disconnected spreadsheets and repetitive workshops to evaluate ROI and technical feasibility.

  The GE Use Case Qualification Agent embeds the GE App Use Case Discovery Framework natively inside Gemini Enterprise. Across three guided workflows - Business Value Intake, Technical Architecture Review, and CoE Portfolio Prioritization - stakeholders converse naturally while the agent populates interactive A2UI forms, computes annual hours saved, recommends the appropriate Gemini Enterprise agent tier for each use case (from no-code assistants and custom skills to low-code Workflow Builder agents and pro-code ADK agents), evaluates 22 technical readiness subcriteria, and segments the backlog into actionable quadrants.


business_value: |
  * **Eliminate Unquantified AI Science Projects:** Calculates auditable annual hours saved from user headcount, weekly frequency, and minutes saved per task over 50 work weeks without invented benchmarks.
  * **Right-Size the Gemini Enterprise Agent Tier:** Recommends the appropriate Gemini Enterprise capability tier for each use case (Levels 1-6: Tier 1 No-Code Assistant/Skills, Tier 2 Low-Code Workflow Builder, or Tier 3 Pro-Code MCP/ADK Agent) before committing engineering capacity.
  * **Accelerate Technical Discovery:** Locks Phase 1 business baselines in Cloud Storage so Solution Architects immediately review systems, network transit, IAM, and ACLs without re-interviewing the business.
  * **Board-Ready Portfolio Prioritization:** Automatically scores Business Value (1-5) and Feasibility (1-5) to rank opportunities into Quick Wins, Strategic Bets, Departmental Niche, and Deprioritized quadrants.


technical_value: |
  * **Native A2A + Interactive A2UI v0.9 Architecture:** Streams JSON-RPC events from Cloud Run to Gemini Enterprise using the A2UI v0.9 composite catalog to render live side-panel forms, tabs, expansion panels, tables, and 2×2 quadrant scatter charts alongside chat.
  * **Evidence-Gated Gemini Extraction & Deterministic Scoring:** Pairs Gemini Flash structured output with verbatim quote verification and deterministic Python engines for tiering and 22-point readiness scoring.
  * **Multi-Actor Optimistic Concurrency & SharePoint Integration:** Persists records in Cloud Storage using three-way merges and generation preconditions so concurrent sessions never overwrite each other, with optional SharePoint integration to publish briefs and dossiers.
  * **Zero-Trust Click-to-Deploy:** Pinned SHA-256 supply chain, non-root container, Discovery Engine service-agent IAM enforcement, and automated GE license provisioning.




