# Gemini Enterprise connector catalog — the single source of truth the
# capability classifier (qualify/scoring/business_tier.py) uses to decide
# whether a data source is natively supported.
#
# Every entry must cite an official page. Nothing here may be asserted from
# memory: if a source cannot be found in the official connector list, it is
# `custom` (needs a custom MCP server) or `unverified`, never `native`.
#
# How this was built (re-run on every review):
#   1. Connector list: the navigation of `source_index` below.
#   2. `actions`: true only when the connector's own page documents end-user
#      actions ("Supported actions" / "perform actions"). Actions are a fixed
#      list per connector; Level 4 guidance tells the user to check the exact
#      action on the cited page.
#   3. `reviewed` is the date of the last check. Changing it re-classifies
#      every stored record on its next scoring, so bump it with each review.
#
# status:
#   native      listed in the official GE connector catalog
#   custom      not in the catalog; needs a custom MCP server (Level 5+)
#   unverified  could not be confirmed either way; treated like `custom`
#               (anti-overcommitment) until someone confirms it

reviewed: "2026-10-02"
source_index: https://cloud.google.com/gemini/enterprise/docs/connectors/introduction-to-connectors-and-data-stores
custom_mcp_doc: https://cloud.google.com/gemini/enterprise/docs/connectors/custom-mcp-server/set-up-custom-mcp-server

connectors:
  # --- Google -----------------------------------------------------------------
  google_drive:
    label: Google Drive
    status: native
    actions: true
    doc: https://cloud.google.com/gemini/enterprise/docs/connectors/gdrive
    aliases: [google drive, drive, google docs, gdrive]
  workspace_mail:
    label: Gmail & Google Calendar
    status: native
    actions: true
    doc: https://cloud.google.com/gemini/enterprise/docs/connectors/gmail
    aliases: [gmail, google calendar, gmail calendar, email or calendar]
  google_chat:
