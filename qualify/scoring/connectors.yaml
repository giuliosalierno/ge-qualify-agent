  google_sites:
    label: Google Sites
    status: native
    actions: false
    doc: https://cloud.google.com/gemini/enterprise/docs/connectors/connect-sites
    aliases: [google sites]
  bigquery:
    label: BigQuery
    status: native
    actions: false
    note: Imported into a data store (ingestion), not queried live.
    doc: https://cloud.google.com/gemini/enterprise/docs/connectors/connect-bigquery
    aliases: [bigquery, big query]
  gcs:
    label: Cloud Storage
    status: native
    actions: false
    note: Ingestion only; periodic sync every 1, 3 or 5 days.
    doc: https://cloud.google.com/gemini/enterprise/docs/connectors/connect-cloud-storage
    aliases: [cloud storage, gcs, cloud storage bucket]
  cloud_sql:
    label: Cloud SQL
    status: native
    actions: false
    note: Imported into a data store (ingestion), not queried live.
    doc: https://cloud.google.com/gemini/enterprise/docs/connectors/connect-cloud-sql
