[project]
name = "ge-qualify-agent"
version = "0.1.0"
description = "Gemini Enterprise use case qualification agent with A2UI living form."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    # 4.18 is where `referencing` replaced RefResolver. The offline $ref
    # registry in qualify/a2ui/validate.py depends on it.
    "jsonschema>=4.18",
    "a2a-sdk[http-server]>=0.3.25,<0.4",
    "a2ui-agent-sdk==0.6.0",
    "python-dotenv>=1.1.0",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["qualify"]
# Hatch ships .py files only by default. The vendored A2UI schemas and the
# question packs are loaded at runtime by path, so without this the wheel
# installs and then fails on first request with a missing-file error.
artifacts = [
    "qualify/a2ui/catalogs/*.json",
    "qualify/packs/*.yaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
start = "qualify.agent.server:serve"

[tool.pytest.ini_options]
testpaths = ["tests"]
