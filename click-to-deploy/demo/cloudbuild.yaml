# Builds the agent image from the repository root.
# Invoked by click-to-deploy/demo/terraform/build.tf with a dedicated build
# service account, which requires an explicit logging mode.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}", "."]
images:
  - "${_IMAGE}"
options:
  logging: CLOUD_LOGGING_ONLY
